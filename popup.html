<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Subtitles</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <div class="header">
      <div class="title-row">
        <img class="logo" src="icons/icon48.png" alt="Classic Subtitles">
        <h1>Classic Subtitles</h1>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="divider"></div>

    <!-- Settings -->
    <div class="settings" id="settings">
      <!-- Target Language -->
      <div class="setting-row">
        <label for="targetLang">Language</label>
        <select id="targetLang">
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh">Chinese</option>
          <option value="ar">Arabic</option>
          <option value="hi">Hindi</option>
          <option value="ru">Russian</option>
        </select>
      </div>

      <!-- Font Size -->
      <div class="setting-row">
        <label for="fontSize">Size</label>
        <div class="range-group">
          <input type="range" id="fontSize" min="14" max="40" step="2" value="24">
          <span class="range-value" id="fontSizeValue">24px</span>
        </div>
      </div>

      <!-- Show Background Overlay -->
      <div class="setting-row">
        <label for="showBackground">Background overlay</label>
        <label class="toggle-switch small">
          <input type="checkbox" id="showBackground">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Highlight Mode -->
      <div class="setting-row">
        <label for="highlightMode">Highlight mode</label>
        <label class="toggle-switch small">
          <input type="checkbox" id="highlightMode">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Show Original -->
      <div class="setting-row">
        <label for="showOriginal">Show original text</label>
        <label class="toggle-switch small">
          <input type="checkbox" id="showOriginal">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Status -->
    <div class="status" id="status">
      Active on this page
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
